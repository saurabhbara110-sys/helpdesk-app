apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  automountServiceAccountToken: false
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          ports:
            - containerPort: 9090
              name: web

          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: prometheus-config-volume
          configMap:
            name: prometheus-config
