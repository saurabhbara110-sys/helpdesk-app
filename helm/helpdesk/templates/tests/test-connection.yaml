apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "helpdesk.fullname" . }}-test-connection"
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccount: false
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "helpdesk.fullname" . }}:{{ .Values.service.port }}']
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
          ephemeral-storage: "256Mi"
        limits:
          memory: "256Mi"
  restartPolicy: Never
