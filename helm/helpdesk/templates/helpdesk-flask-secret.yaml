{{- if .Values.createFlaskSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: helpdesk-flask-secret
  namespace: helpdesk

type: Opaque

stringData:
  FLASK_SECRET_KEY: {{ .Values.flaskSecretKey | quote }}

{{- end }}

# putting inside if condition so that argocd does not render this yaml and let jenkins handle it.
