apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-app
  namespace: helpdesk

spec:
  replicas: 3
  selector:
    matchLabels:
      app: helpdesk-app

  template:
    metadata:
      labels:
        app: helpdesk-app

    spec:
      automountServiceAccountToken: false

      containers:
        - name: helpdesk-app-container
          image: saurabhbara110/helpdesk-app:15
          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: DB_HOST
              value: postgres

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres-configmap
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-configmap
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
